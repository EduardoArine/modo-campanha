<!-- Conteúdo visual; o nome acessível fica no host (role="img"). -->
<div class="cart">
  <!-- Sombra de objeto (retângulo interno, fora do recorte) e espessura (segunda camada). -->
  <span class="shadow"></span>
  <span class="edge"></span>

  <div class="shell">
    <span class="grip grip--left"></span>
    <span class="grip grip--right"></span>

    <div class="top">
      <span class="system">{{ ui().cart.system }}</span>
      <span class="serial">{{ serial() }}</span>
    </div>

    <div class="recess">
      <div class="label" [class]="'label label--' + accent()">
        <div class="art">
          @if (artwork(); as art) {
            <img [src]="art.src" alt="" />
          } @else {
            <span class="art-placeholder">{{ ui().cart.artworkPlaceholder }}</span>
          }
        </div>
        <div class="band">
          <span class="title">{{ title() }}</span>
          <span class="type">{{ type() }}</span>
        </div>
      </div>
    </div>

    <span class="slot"></span>
    <span class="rail"></span>
    <span class="contacts"></span>
  </div>
</div>
