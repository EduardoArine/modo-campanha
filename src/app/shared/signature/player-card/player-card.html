<article class="card" [attr.aria-labelledby]="nameId">
  <div class="photo">
    @if (photo(); as p) {
      <img
        [src]="p.src"
        [attr.srcset]="p.srcset ?? null"
        [attr.sizes]="p.srcset ? sizes() : null"
        [attr.width]="p.width ?? null"
        [attr.height]="p.height ?? null"
        [alt]="p.alt"
        loading="lazy"
        decoding="async"
      />
    } @else {
      <span class="placeholder" aria-hidden="true">{{ ui().playerCard.photoPlaceholder }}</span>
    }
    <span class="capsule" aria-hidden="true"></span>
    @if (badge(); as b) {
      <span class="badge" aria-hidden="true">
        <span class="badge-label">{{ b.label }}</span>
        <span class="badge-value">{{ b.value }}</span>
      </span>
    }
  </div>

  <div class="plate">
    <p class="name" [id]="nameId">{{ name() }}</p>
    <p class="player">{{ ui().playerCard.player }}</p>
    <span class="bar" aria-hidden="true"></span>
  </div>
</article>
