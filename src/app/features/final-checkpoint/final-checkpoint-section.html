<section
  id="final-checkpoint"
  class="mc-page-grid section"
  aria-labelledby="final-checkpoint-title"
>
  <mc-section-header
    [heading]="ui().sections.finalCheckpoint"
    headingId="final-checkpoint-title"
    [code]="ui().finalCheckpoint.save"
  />

  <div class="body">
    <p class="closing">{{ locale.pick(profile.closing) }}</p>

    <div class="actions">
      @for (link of links; track link.kind) {
        <a mcAction="secondary" [href]="link.url" target="_blank" rel="noopener noreferrer">
          {{ link.label }} <mc-icon name="external" />
          <span class="mc-visually-hidden">{{ ui().a11y.newTab }}</span>
        </a>
      }
      @if (resume; as cv) {
        <!-- Currículo (D-099): o PDF do idioma da página, numa nova aba. -->
        <a
          mcAction="secondary"
          class="resume"
          [href]="cv.localizedUrl ? locale.pick(cv.localizedUrl) : cv.url"
          type="application/pdf"
          target="_blank"
          rel="noopener"
        >
          <mc-icon name="document" /> {{ ui().cta.resume }}
          <span class="mc-visually-hidden">{{ ui().a11y.pdf }}</span>
        </a>
      }
    </div>
  </div>
</section>
