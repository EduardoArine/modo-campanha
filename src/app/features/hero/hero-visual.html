<!-- Ordem do DOM = profundidade: ambiente → CRT → console → cartucho → controle. Renders com
     loading="lazy": no mobile ficam abaixo da dobra e não disputam banda com o texto (LCP). -->
<div class="stage">
  <span class="ambient" [style.--ambient]="ambient"></span>

  <!-- Plano 3: CRT, display do sistema; a tela é recortada no vidro do render. -->
  <div class="obj crt">
    <img
      [src]="scene.crt.src"
      [srcset]="scene.crt.srcset"
      sizes="(min-width: 1200px) 27vw, (min-width: 768px) 34vw, 62vw"
      [width]="scene.crt.width"
      [height]="scene.crt.height"
      alt=""
      loading="lazy"
      decoding="async"
    />
    <svg class="screen" [attr.viewBox]="glass.viewBox" focusable="false">
      <defs>
        <clipPath id="hero-crt-glass"><path [attr.d]="glass.path" /></clipPath>
        <radialGradient id="hero-crt-vignette" cx="0.5" cy="0.45" r="0.62">
          <stop offset="0.6" class="s-clear" />
          <stop offset="1" class="s-groove" />
        </radialGradient>
      </defs>
      <g clip-path="url(#hero-crt-glass)">
        @if (running(); as cart) {
          <image
            class="screen-art"
            [attr.href]="scene.screen.src"
            [attr.x]="glass.box.x"
            [attr.y]="glass.box.y"
            [attr.width]="glass.box.width"
            [attr.height]="glass.box.height"
            preserveAspectRatio="xMidYMid slice"
          />
          <rect class="screen-tag-bg" x="150" y="648" width="510" height="56" />
          <text class="screen-tag" x="170" y="687">{{ cart.serial }} · {{ cart.title }}</text>
        } @else {
          <text class="screen-message" x="472" y="446" text-anchor="middle">
            {{ message() }}
          </text>
        }
        <rect
          class="screen-vignette"
          [attr.x]="glass.box.x"
          [attr.y]="glass.box.y"
          [attr.width]="glass.box.width"
          [attr.height]="glass.box.height"
          fill="url(#hero-crt-vignette)"
        />
      </g>
    </svg>
  </div>

  <!-- Plano 2: MC-01 com o cartucho no slot, MC-CART MC-001 na mesa e o controle à frente. -->
  <img
    class="obj console"
    [src]="scene.console.src"
    [srcset]="scene.console.srcset"
    sizes="(min-width: 1200px) 34vw, (min-width: 768px) 46vw, 84vw"
    [width]="scene.console.width"
    [height]="scene.console.height"
    alt=""
    loading="lazy"
    decoding="async"
  />
  <img
    class="obj cart"
    [src]="scene.cart.src"
    [srcset]="scene.cart.srcset"
    sizes="(min-width: 1200px) 10vw, 16vw"
    [width]="scene.cart.width"
    [height]="scene.cart.height"
    alt=""
    loading="lazy"
    decoding="async"
  />
  <img
    class="obj controller"
    [src]="scene.controller.src"
    [srcset]="scene.controller.srcset"
    sizes="(min-width: 1200px) 24vw, (min-width: 768px) 30vw, 44vw"
    [width]="scene.controller.width"
    [height]="scene.controller.height"
    alt=""
    loading="lazy"
    decoding="async"
  />
</div>
