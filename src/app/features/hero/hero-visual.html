<div class="scene">
  <mc-crt-frame class="crt">
    @if (running(); as cart) {
      <!-- Cartucho em execução: o artwork aprovado do MC-001 preenche o vidro. -->
      <div class="screen-art">
        <img [src]="cart.screen" alt="" width="640" height="400" />
        <p class="screen-tag">{{ cart.serial }} · {{ cart.title }}</p>
      </div>
    } @else {
      <p class="screen-message">{{ message() }}</p>
    }
  </mc-crt-frame>

  <div class="rig">
    <span class="desk"></span>
    @if (assets.hardware; as src) {
      <img class="hardware" [src]="src" alt="" />
    } @else {
      <!-- Console MC-01 + MC-CART inserido + controle (vetorial, autoral). -->
      <svg class="hardware" viewBox="0 0 640 320" focusable="false">
        <defs>
          <linearGradient id="hw-top-light" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" class="s-highlight" />
            <stop offset="1" class="s-clear" />
          </linearGradient>
          <linearGradient id="hw-shade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" class="s-clear" />
            <stop offset="1" class="s-groove" />
          </linearGradient>
          <linearGradient id="hw-side" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" class="s-highlight" />
            <stop offset="0.35" class="s-clear" />
            <stop offset="1" class="s-groove" />
          </linearGradient>
        </defs>

        <!-- Sombras de contato na mesa. -->
        <ellipse class="hw-shadow" cx="325" cy="242" rx="252" ry="13" />
        <ellipse class="hw-shadow" cx="500" cy="316" rx="128" ry="7" />

        <!-- Corpo: frente + tampo com bisel. -->
        <rect class="hw-body" x="84" y="136" width="482" height="102" rx="18" />
        <rect
          class="hw-overlay"
          x="84"
          y="136"
          width="482"
          height="102"
          rx="18"
          fill="url(#hw-shade)"
        />
        <path class="hw-body" d="M120 104H530Q552 104 562 138H88Q98 104 120 104Z" />
        <path
          class="hw-overlay"
          d="M120 104H530Q552 104 562 138H88Q98 104 120 104Z"
          fill="url(#hw-top-light)"
        />
        <path class="hw-edge" d="M94 138H556" />

        <!-- Botão de ejeção + slot de cartucho no tampo. -->
        <rect class="hw-groove" x="176" y="114" width="40" height="11" rx="4" />
        <rect class="hw-well" x="232" y="110" width="186" height="20" rx="5" />

        <!-- MC-CART MC-001 inserido (shell laranja, rótulo com o artwork aprovado). -->
        @if (cartridge(); as cart) {
          <g class="cart">
            <path class="cart-shell" d="M262 18H388L400 30V128H250V30Z" />
            <path class="hw-overlay" d="M262 18H388L400 30V128H250V30Z" fill="url(#hw-side)" />
            <path class="cart-grip" d="M257 52v58M393 52v58" />
            <text class="cart-ink" x="264" y="31">{{ ui().cart.system }}</text>
            <text class="cart-ink" x="386" y="31" text-anchor="end">{{ cart.serial }}</text>
            <rect class="cart-label" x="264" y="38" width="122" height="82" rx="4" />
            <rect class="cart-accent" x="264" y="38" width="122" height="4" rx="2" />
            <image
              class="cart-art"
              x="268"
              y="46"
              width="114"
              height="71"
              preserveAspectRatio="xMidYMid slice"
              [attr.href]="cart.art"
            />
          </g>
        }
        <!-- Lábio frontal do slot: esconde a base do cartucho. -->
        <rect class="hw-body" x="226" y="126" width="198" height="12" />
        <path class="hw-groove-line" d="M232 127H418" />

        <!-- Frente: POWER (ligado) e RESET, etiqueta MC-01, LED, portas e ventilação. -->
        <rect class="hw-groove" x="120" y="158" width="64" height="14" rx="7" />
        <rect class="hw-power" x="152" y="159" width="30" height="12" rx="6" />
        <rect class="hw-groove" x="200" y="158" width="64" height="14" rx="7" />
        <rect class="hw-switch" x="202" y="159" width="30" height="12" rx="6" />
        <text class="hw-ink" x="325" y="171" text-anchor="middle">
          {{ ui().crt.identification }}
        </text>
        <circle class="hw-led-glow" cx="534" cy="165" r="11" />
        <circle class="hw-led" cx="534" cy="165" r="4" />
        <path class="hw-groove-line" d="M104 188H546" />
        <rect class="hw-port" x="120" y="198" width="46" height="24" rx="7" />
        <rect class="hw-port" x="176" y="198" width="46" height="24" rx="7" />
        <path
          class="hw-vents"
          d="M452 200v22M466 200v22M480 200v22M494 200v22M508 200v22M522 200v22"
        />

        <!-- Cabo do controle até a porta 2. -->
        <path class="hw-cable" d="M418 266C370 300 236 302 199 222" />

        <!-- Controle MC-01: corpo em "osso", D-pad, dois botões, SELECT/START. -->
        <g class="controller">
          <path class="ctl-body" d="M420 244H580A36 36 0 0 1 580 316H420A36 36 0 0 1 420 244Z" />
          <path
            class="hw-overlay"
            d="M420 244H580A36 36 0 0 1 580 316H420A36 36 0 0 1 420 244Z"
            fill="url(#hw-top-light)"
          />
          <path class="hw-groove-line" d="M394 258Q406 244 432 244M568 244Q594 244 606 258" />
          <circle class="ctl-well" cx="424" cy="280" r="20" />
          <rect class="ctl-dpad" x="410" y="275" width="28" height="10" rx="2" />
          <rect class="ctl-dpad" x="419" y="266" width="10" height="28" rx="2" />
          <rect
            class="hw-groove"
            x="472"
            y="282"
            width="18"
            height="7"
            rx="3.5"
            transform="rotate(-18 481 285)"
          />
          <rect
            class="hw-groove"
            x="496"
            y="282"
            width="18"
            height="7"
            rx="3.5"
            transform="rotate(-18 505 285)"
          />
          <text class="ctl-ink" x="493" y="268" text-anchor="middle">
            {{ ui().crt.identification }}
          </text>
          <circle class="ctl-well" cx="580" cy="280" r="24" />
          <circle class="ctl-btn" cx="568" cy="290" r="9" />
          <circle class="ctl-btn ctl-btn--alt" cx="592" cy="272" r="9" />
        </g>
      </svg>
    }
  </div>
</div>
