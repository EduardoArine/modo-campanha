<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Modo Campanha — Eduardo Arine</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Portfólio profissional de Eduardo Arine: carreira em desenvolvimento, IA, produtos digitais e gamificação apresentada como uma campanha de videogame."
    />
    <!-- Open Graph estático (pt-BR, D-060): crawlers sociais não executam JS. O LocaleService
         atualiza por idioma em runtime. og:image (D-085): a URL absoluta entra no pós-build do
         Pages (scripts/pages-postbuild.mjs), que conhece o domínio; aqui ficam tipo, tamanho e alt. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Modo Campanha" />
    <meta property="og:title" content="Modo Campanha — Eduardo Arine" />
    <meta
      property="og:description"
      content="Portfólio profissional de Eduardo Arine: carreira em desenvolvimento, IA, produtos digitais e gamificação apresentada como uma campanha de videogame."
    />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Modo Campanha — Eduardo Arine, Desenvolvedor de Produtos Digitais, com o cartucho MC-001."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Sem SSR, a fonte só seria pedida quando o "MODO CAMPANHA" da Hero já estivesse na tela
         (troca visível em rede lenta). O preload busca já no HTML (D-079). O nome vem do build
         sem hash (outputHashing: bundles); ao trocar o arquivo, atualizar aqui. A IBM Plex Sans
         já chega antes do primeiro render: sem preload. -->
    <link
      rel="preload"
      href="media/pixelify-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Home pré-renderizada (D-098): a primeira pintura espera o HTML do Hero chegar inteiro (até a
         seção seguinte), para a linha de CTAs não entrar depois e deslocar o bloco em rede lenta.
         Sem a seção (página sem pré-render) ou em navegadores sem suporte, nada muda. -->
    <link rel="expect" href="#player-status" blocking="render" />
    <!-- Símbolo do Modo Campanha (D-085); fonte: design/source/brand/build-symbol.mjs. -->
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
