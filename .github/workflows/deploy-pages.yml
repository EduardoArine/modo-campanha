# Deploy do Modo Campanha no GitHub Pages.
# Disparo MANUAL de propósito (Actions → Deploy to GitHub Pages → Run workflow):
# nada é publicado automaticamente enquanto o site estiver incompleto.
# Para publicar a cada push na main no futuro, adicionar `push: branches: [main]` em `on`.
# Pré-requisito único: Settings → Pages → Source = "GitHub Actions".
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test -- --watch=false

      - run: npm run build:gh-pages

      # Guarda: o showcase do design system (dev only) nunca pode ir para produção.
      - run: "! grep -rl 'design-system-page' dist/modo-campanha/browser"

      # Guarda: conteúdo MOCK (Campaign Log D-049, Achievements D-051, Current Main Quest docs/18, Side Quests docs/19) nunca pode ir para produção.
      - run: "! grep -rlE 'mock-campaign-log|mock-achievement|mock-current-quest|mock-side-quest|mock-inventory' dist/modo-campanha/browser"

      # Guarda: todo preload do index.html (Pixelify Sans, D-079) aponta para um arquivo do build.
      - run: |
          cd dist/modo-campanha/browser
          for f in $(grep -o 'rel="preload" href="[^"]*"' index.html | sed 's/.*href="//; s/"$//'); do
            test -f "$f" || { echo "preload sem arquivo: $f"; exit 1; }
          done

      # URL real do site (base_url), usada no canonical, no hreflang e no sitemap.
      - id: pages
        uses: actions/configure-pages@v6

      # 404.html (fallback de SPA), en/index.html já em inglês (rota /en, D-020; prévias sociais),
      # canonical/hreflang/og:url estáticos e sitemap.xml (D-084).
      - run: node scripts/pages-postbuild.mjs dist/modo-campanha/browser "${{ steps.pages.outputs.base_url }}"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/modo-campanha/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
