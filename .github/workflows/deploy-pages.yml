# Deploy do Modo Campanha no GitHub Pages.
# Disparo MANUAL de propósito (Actions → Deploy to GitHub Pages → Run workflow):
# nada é publicado automaticamente enquanto o site estiver incompleto.
# Para publicar a cada push na main no futuro, adicionar `push: branches: [main]` em `on`.
# Pré-requisito único: Settings → Pages → Source = "GitHub Actions".
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test -- --watch=false

      - run: npm run build:gh-pages

      # Guarda: o showcase do design system (dev only) nunca pode ir para produção.
      - run: "! grep -rl 'design-system-page' dist/modo-campanha/browser"

      # Guarda: o conteúdo MOCK do Campaign Log (D-049) nunca pode ir para produção.
      - run: "! grep -rl 'mock-campaign-log' dist/modo-campanha/browser"

      # SPA fallback: o GitHub Pages serve 404.html para rotas desconhecidas.
      # en/index.html faz /modo-campanha/en responder 200 (rota do inglês, D-020).
      - run: |
          cd dist/modo-campanha/browser
          cp index.html 404.html
          mkdir -p en && cp index.html en/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/modo-campanha/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
